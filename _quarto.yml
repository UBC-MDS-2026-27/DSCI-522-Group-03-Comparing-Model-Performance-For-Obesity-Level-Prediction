lang: en

project:
  # otherwise README.md renders too
  render:
    - reports/*.qmd

format:
  html:
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    toc-location: left
    number-sections: true
    embed-resources: true
    code-overflow: wrap
    format-links:
      - html
      - text: PDF
        href: https://github.com/UBC-MDS-2026-27/DSCI-522-Group-03-Comparing-Model-Performance-For-Obesity-Level-Prediction/blob/main/reports/obesity-prediction.pdf
        icon: file-pdf
    include-in-header:
      text: |
        <style>
        .cell-output-display img { max-width: 100%; height: auto; }
        main p, main li { text-align: justify; hyphens: auto; }
        </style>
  # PDF via Typst, which comes with Quarto
  typst:
    # png figures for the PDF
    fig-format: png
    code-overflow: wrap
    # shrink figures and tables to fit the page
    # (Typst code below; `x => ...` is a function of x)
    include-in-header:
      text: |
        #show image: it => layout(size => if it.width == auto or it.width <= size.width { it } else { image(it.source, width: size.width) })
        #show table: set text(size: 9pt)